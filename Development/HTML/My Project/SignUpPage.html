<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup Page</title>
</head>
<body>
  <h2 style="text-align: center;">Signup Page</h2>
  
  <form action="/submit_signup" method="post" style="text-align: center;">
    <!-- Full Name -->
    <label for="name">Full Name:</label><br>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

    <!-- Email -->
    <label for="email">Email:</label><br>
    <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>

    <!-- Username -->
    <label for="username">Username:</label><br>
    <input type="text" id="username" name="username" placeholder="Choose a username" required><br><br>

    <!-- Password -->
    <label for="password">Password:</label><br>
    <input type="password" id="password" name="password" placeholder="Enter password" required><br><br>

    <!-- Confirm Password -->
    <label for="confirm">Confirm Password:</label><br>
    <input type="password" id="confirm" name="confirm" placeholder="Re-enter password" required><br><br>

    <!-- Signup Button -->
    <input type="submit" value="Sign Up">
  </form>
</body>
</html>
