<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./styler2.css">
</head>
<body>
        <div class="box">
            <form>
                <h1>Signup Form</h1>
                <div>
                    <label for="username">Username</label>
                    <input type="text" placeholder="Enter your username:" style="display: block;">
                </div>
                <div>
                    <label for="email">Email</label>
                    <input type="email" placeholder="Enter your email" style="display: block;">
                </div>
                <div>
                    <label for="password">Password</label>
                    <input type="password" placeholder="Enter your password" style="display: block;">
                </div>
                <div>
                    <label for="ConfirmPassword">Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" style="display: block;">
                </div>
                <button style="width: 100%; background-color: green; color: white; border-radius: 5px; padding: 10px; height: 40px; ">Signup</button>
            </form>
        </div>
</body>
</html>
